name: Release public beta

# Manual release gate: verify, deploy data and code, then smoke-test the
# deployed beta on desktop and mobile. See docs/deployment.md.
on:
  workflow_dispatch:

concurrency:
  group: release-beta
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            api/pnpm-lock.yaml
            ui/pnpm-lock.yaml
      - name: Install API dependencies
        working-directory: api
        run: pnpm install --frozen-lockfile
      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: API typecheck and tests
        working-directory: api
        run: pnpm typecheck && pnpm test
      - name: UI lint and typecheck
        working-directory: ui
        run: pnpm lint && pnpm typecheck
      - name: Release and source-check script tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Install Chromium
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser journeys on desktop and mobile
        working-directory: ui
        run: pnpm test:browser
      - name: Upload browser report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-journeys
          path: |
            ui/playwright-report
            ui/test-results

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: dev
    # Secrets are passed only to the steps that need them.
    env:
      PUBLIC_UI_URL: ${{ vars.PUBLIC_UI_URL }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            api/pnpm-lock.yaml
            ui/pnpm-lock.yaml

      - name: Check release configuration
        env:
          SMOKE_EMAIL: ${{ vars.SMOKE_EMAIL }}
          SMOKE_EMAIL_CODE: ${{ secrets.SMOKE_EMAIL_CODE }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN_API: ${{ secrets.CLOUDFLARE_API_TOKEN_API }}
          CLOUDFLARE_API_TOKEN_UI: ${{ secrets.CLOUDFLARE_API_TOKEN_UI }}
        run: python scripts/check_release_config.py

      - name: Check source-check workflows are enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in check-current-courses.yml check-academic-sources.yml; do
            state=$(gh api "repos/${{ github.repository }}/actions/workflows/$workflow" --jq .state)
            if [ "$state" != "active" ]; then
              echo "::error::$workflow is $state; enable it before release."
              exit 1
            fi
          done

      - name: Install API dependencies
        working-directory: api
        run: pnpm install --frozen-lockfile

      - name: Scrape OMSCentral reviews
        working-directory: omscentral-scraper
        run: uv run omscentral-scrape

      - name: Prepare Catalog and review import
        working-directory: api
        run: |
          pnpm import:omscentral --historical-out "$RUNNER_TEMP/historical-courses.json" --sql-out "$RUNNER_TEMP/omscentral-import.sql"
          if ! diff -u ../ui/lib/data/historical-courses.json "$RUNNER_TEMP/historical-courses.json"; then
            echo "::error::Historical review courses changed. Regenerate ui/lib/data/historical-courses.json, review, and merge before release."
            exit 1
          fi

      - name: Apply D1 migrations
        working-directory: api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_API }}
        run: pnpm wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote

      - name: Import Catalog facts and Imported Reviews
        working-directory: api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_API }}
        run: pnpm import:omscentral --apply --remote --database "$D1_DATABASE_NAME" --sql-out "$RUNNER_TEMP/omscentral-import.sql"

      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_API }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          command: deploy
          secrets: |
            CLERK_SECRET_KEY
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Check API health
        run: curl -fsS --retry 5 --retry-all-errors "$NEXT_PUBLIC_API_BASE_URL/health"

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Build public Catalog
        working-directory: ui
        run: pnpm build

      - name: Deploy UI Workers Assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_UI }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ui
          command: deploy

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Deployed smoke on desktop and mobile
        working-directory: ui
        env:
          SMOKE_BASE_URL: ${{ vars.PUBLIC_UI_URL }}
          SMOKE_API_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          SMOKE_EMAIL: ${{ vars.SMOKE_EMAIL }}
          SMOKE_EMAIL_CODE: ${{ secrets.SMOKE_EMAIL_CODE }}
        run: pnpm test:smoke:deployed
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-smoke
          path: |
            ui/playwright-report/deployed
            ui/test-results/deployed
