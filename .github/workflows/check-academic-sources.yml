name: Check OMSCS rules and term offerings

on:
  schedule:
    - cron: "33 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install UI rule-export dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Test source checks
        run: python -m unittest discover -s scripts/tests -v
      - name: Check official rules and released term schedules
        run: python scripts/check_academic_sources.py
      - name: Find existing academic proposal
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "number=$(gh pr list --head automation/academic-source-review --state open --json number --jq '.[0].number // ""')" >> "$GITHUB_OUTPUT"
      - name: Propose review of detected changes
        if: ${{ hashFiles('proposals/academic-sources.md') != '' && steps.existing.outputs.number == '' }}
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            proposals/academic-sources.md
            proposals/academic-change-set.json
          branch: automation/academic-source-review
          delete-branch: true
          commit-message: "chore(academics): propose official source review"
          title: "Review official Specialization and term-offering changes"
          body-path: proposals/academic-sources.md
          draft: true
      - name: Surface changes while proposal is under review
        if: ${{ hashFiles('proposals/academic-sources.md') != '' && steps.existing.outputs.number != '' }}
        run: |
          echo "::error::Academic source differs while an existing draft PR is under review. Review that PR and rerun this workflow after it closes."
          exit 1
      - name: Surface obsolete proposal
        if: ${{ hashFiles('proposals/academic-sources.md') == '' && steps.existing.outputs.number != '' }}
        run: |
          echo "::error::Official Specialization sources and released term schedules match published evidence, but an older draft proposal remains open. Review and close the obsolete PR."
          exit 1
